# railway.toml — Railway project configuration
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Standard start command. The bot now runs continuously (as a daemon)
# and manages its own schedule internally using APScheduler.
# Make sure you deploy this as a standard "Service" in Railway,
# NOT as a "Cron Job" service.
startCommand = "python -m app.main"
restartPolicyType = "ON_FAILURE"
